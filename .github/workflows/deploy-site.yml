# Deploys the prebuilt public site on the `site` branch to Cloudflare Pages (project cygnus-sky).
# This file lives on the `site` branch, which holds only this workflow and public/ (the bundle from
# tools/build_pages_bundle.py, already leak-scanned). It is written there by tools/push_site_branch.py;
# its source of truth is tools/site_branch/deploy-site.yml on main. Nothing is built here.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
name: deploy-site

on:
  push:
    branches: [site]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the bundle and the secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          test -f public/index.html || { echo "public/index.html missing: not a site bundle"; exit 1; }
          test -f public/SITE_BUILD.json || { echo "public/SITE_BUILD.json missing"; exit 1; }
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy."
            exit 1
          fi
          echo "files: $(find public -type f | wc -l)  size: $(du -sh public | cut -f1)"
          cat public/SITE_BUILD.json
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy public --project-name cygnus-sky --branch main --commit-dirty=true
