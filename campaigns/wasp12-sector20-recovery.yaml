schema: cygnus.campaign/1
campaign_id: wasp12-sector20-recovery
objective: >
  Recover the known planet WASP-12 b in one TESS SPOC 120-s light curve (Sector 20) with a bounded
  box-least-squares search, as a pipeline smoke test. Not a discovery search.
outputs: campaigns/wasp12_sector20/
random_seed: 20260925          # the permutation-null seed of the 2026-09-24 run (campaigns/run_wasp12_sector20.py)

targets:
  - name: WASP-12

input:
  archive: MAST
  release_pipeline: TESS SPOC
  products:
    - product_id: tess2019357164649-s0020-0000000086396382-0165-s_lc.fits
      sector: 20
      expected_sha256: bf74a16f6e0c40b693a66de922e142d446cb44cee5bb7f26843062e436957f63
      expected_bytes: 1926720

steps:
  - fetch_products:
      search_dirs: ["scratch:campaign_wasp12"]
  - bls_recovery:
      product: tess2019357164649-s0020-0000000086396382-0165-s_lc.fits
      period_grid: [0.5, 5.0, 5000]
      duration_arange: [0.06, 0.161, 0.02]
      permutation_trials: 20
      legacy_campaign_label: wasp12-sector20-validation
      query_provenance: "Tier-1 manifest row: TESS/SPOC timeseries cone around TIC 86396382; 0.05 deg; LC product"
      interpretation: "Known-planet recovery / software validation only; no novelty claim."
      caveats:
        - "Single sector; no independent epoch processed in this campaign."
        - "Permutation null destroys time correlation and is not a calibrated red-noise false-alarm probability."
        - "No pixel-level centroid/difference-image, aperture, or pointing-jitter artifact audit was run."
        - "Reported period is a discovery-grid estimate, not a refined ephemeris."
  - prior_art:
      radius_arcsec: 30

record:
  path: campaigns/wasp12_sector20/sky_record.json
  title: "Known-planet recovery: WASP-12 b in TESS Sector 20"
  kind: known-planet recovery (pipeline smoke test)
  outcome: pipeline_check
  date: "2026-09-24"
  report: campaigns/wasp12_sector20/REPORT.md
  search_log: campaigns/wasp12_sector20/SEARCH_LOG.md
  summary: >
    BLS recovered the known WASP-12 b signal at P = 1.0914183 d (grid estimate), duration 2.448 h,
    depth 1.4228 % in PDCSAP flux, with a similar box in SAP. A pipeline check on a known planet, not a detection.
  append_runner_notes: false
  checks:
    - {name: "Product integrity (SHA-256)", state: not_tested}
    - {name: "Cadence quality mask and finite-flux selection", state: passed, note: "Quality flags were not individually decoded."}
    - {name: "PDC versus SAP persistence", state: inconclusive, reported_as: "partial diagnostic", note: "Comparable depth and power at the PDC ephemeris; not an independent reduction."}
    - {name: "Alternative detrending / aperture", state: not_tested}
    - {name: "Transit centroid / difference image / blend audit", state: not_tested}
    - {name: "Pointing / centroid-jitter correlation", state: not_tested}
    - {name: "Red-noise-aware null or calibrated FAP", state: not_tested, note: "Permutation null labelled inadequate in the report."}
    - {name: "Independent epoch / instrument", state: not_tested}
    - {name: "Catalogue cross-match", state: not_tested}
    - {name: "Literature (ADS) audit", state: not_tested, reported_as: "not performed in this run"}
