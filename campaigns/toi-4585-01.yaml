# CYGNUS known-object test for TOI-4585.01, generated 2026-09-25 by `python -m cygnus.campaign new`.
# Target values are copied from: campaigns/tess-mono-01/target_queue.csv (rank 67), itself from the NASA Exoplanet Archive TOI table. Run with
#   python -m cygnus.campaign run campaigns/toi-4585-01.yaml
#   python -m cygnus.campaign report campaigns/toi-4585-01.yaml        (docs/AGENT_RUNBOOK.md)
schema: cygnus.campaign/1
campaign_id: toi-4585-01
parent: tess-mono-01
domain: worlds.planetary.monotransit
objective: >
  Known-object test on TOI-4585.01 (TIC 233529335, PC): check that the calibrated residual screen
  recovers the catalogued single transit in its SPOC 120-s light curve, measure the depth, then screen the same light curves for further transit-like
  dips outside the catalogued transits. A further dip is an unverified lead until vetted; it does
  not imply a period.
outputs: campaigns/toi-4585-01/
random_seed: 20260927

targets:
  - name: TOI-4585.01
    tic: 233529335
    ra_deg: 280.203329
    dec_deg: 62.506346
    frame: ICRS
    epoch: J2015.5
    position_source: NASA Exoplanet Archive TOI table (Gaia DR2 epoch J2015.5, verified reports/position-epoch-audit-01)
    t0_bjd: 2458915.989125
    period_days: null
    depth_ppm: 384.7552746
    duration_h: 12.8976378
    tmag: 9.64656
    catalogue_row_updated: "2022-11-15 16:02:02"

# Catalogued transits are excluded from the search for further dips and are the positive control.
veto:
  kind: single_epoch
  veto_hours: 12

steps:
  - fetch_products:
      from_targets: {max_products_per_target: 6}
  - calibrate_screen:
      declared_k: 5.0
      window_days: 2.0
      k_grid: [2.5, 3.0, 3.5, 4.0, 4.5, 5.0, 5.5, 6.0, 7.0, 8.0, 10.0, 12.0]
      max_null_events: 0
      depths_ppm: [500, 1000, 2000, 5000, 10000, 20000]
      durations_h: [1.0, 2.0, 4.0, 8.0]
      injections_per_cell: 10
      reference_signal: {depth_ppm: 2000, duration_h: 4.0}
  - known_signal_recovery:
      k_mad: calibrated
      epoch_tolerance_hours: 2.0
  - residual_screen:
      windows_days: [1.0, 2.0, 3.0]
      k_mad: calibrated
      min_cadences: 2
      series_window_days: 2.0
  - period_aliases:
      depth_ratio: [0.5, 2.0]
      min_period_days: 1.0
      min_coverage: 0.5
      excluded_below: 0.3
  - prior_art:
      radius_arcsec: 30

record:
  path: campaigns/toi-4585-01/sky_record.json
  title: Known-object test, TOI-4585.01
  kind: known-object test
  outcome: pipeline_check
  report: campaigns/toi-4585-01/REPORT.md
  search_log: campaigns/toi-4585-01/SEARCH_LOG.md
  summary: >
    Known-object test on TOI-4585.01: positive control on the catalogued transit(s), calibrated
    screen for further dips, catalogue cross-match.
  checks:
    - {name: "Product integrity (SHA-256)", state: not_tested}
    - {name: "Known-signal recovery (positive control)", state: not_tested}
    - {name: "Calibrated false-alarm threshold (sign-flip null)", state: not_tested}
    - {name: "Synthetic signal injection–recovery", state: not_tested}
    - {name: "Catalogue cross-match", state: not_tested}
    - {name: "Period aliases (repeat events)", state: not_tested}
    - {name: "Alternative detrending", state: not_tested}
    - {name: "Difference-image centroids / blend audit", state: not_tested}
    - {name: "Pointing / jitter correlation", state: not_tested}
    - {name: "Literature (ADS) audit", state: not_tested}
