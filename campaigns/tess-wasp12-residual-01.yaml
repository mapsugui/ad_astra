campaign_id: tess-wasp12-residual-01
objective: >
  In one verified SPOC 120-s light curve for TIC 86396382/WASP-12,
  test whether any isolated negative excursion survives robust local-baseline
  subtraction, appears in both SAP and PDCSAP flux, and is inconsistent with
  the known periodic transit phase. This is a finite anomaly triage, not novelty.
input:
  archive: MAST
  release_pipeline: TESS SPOC
  products:
    - product_id: tess2019357164649-s0020-0000000086396382-0165-s_lc.fits
      sector: 20
      expected_sha256: bf74a16f6e0c40b693a66de922e142d446cb44cee5bb7f26843062e436957f63
      expected_bytes: 1926720
      scratch_path: D:/AO_Artifacts/cygnus_scratch/campaign_wasp12/tess2019357164649-s0020-0000000086396382-0165-s_lc.fits
    - product_id: tess2021258175143-s0043-0000000086396382-0214-s_lc.fits
      sector: 43
      expected_sha256: e3d5c6f76884014ec1dec1eb60f04eaf734330a7abd8eef99141f49df03b2493
      expected_bytes: 1811520
      scratch_path: D:/AO_Artifacts/cygnus_scratch/campaign_wasp12/tess2021258175143-s0043-0000000086396382-0214-s_lc.fits
selection:
  target_set: [TIC 86396382]
  epochs: [2019 sector 20; exact TIME span read from FITS headers]
  cadence: 120 s
  quality: exclude nonzero QUALITY; require finite TIME, SAP_FLUX, PDCSAP_FLUX
