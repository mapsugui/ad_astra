[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cygnus"
version = "0.1.0"
description = "Project Cygnus/Astraea astronomical data-forensics toolkit (analysis layer)"
requires-python = ">=3.10"
# Core is stdlib-only so the scaffold's unit tests run without the science stack.
dependencies = []

[project.optional-dependencies]
mast = ["astroquery>=0.4.7", "astropy>=5.3", "lightkurve>=2.4"]
timing = ["wotan>=1.12", "transitleastsquares>=1.0.24", "celerite2>=0.3", "batman-package>=2.4", "dynesty>=2.0"]
imaging = ["photutils>=1.8", "sep>=1.4", "astroscrappy>=1.2"]
analysis = ["numpy>=1.24", "astropy>=5.3"]
moving = ["skyfield>=1.45", "astroquery>=0.4.7"]
site = ["jinja2>=3.1", "pyyaml>=6.0"]
# campaign runner (python -m cygnus.campaign) and the sky-explorer build
campaign = ["pyyaml>=6.0", "numpy>=1.24", "scipy>=1.10", "astropy>=5.3", "requests>=2.28", "astroquery>=0.4.7"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cygnus.publish" = ["templates/*.j2", "static/*"]
"cygnus.multi" = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires live internet access to public archives (not run by default)",
    "slow: seeded synthetic calibration runs (L1); run with -m slow",
    "replay: checksum-pinned replay of committed campaigns from local scratch (L2); run with -m replay",
]
addopts = "-m 'not network and not slow and not replay' --strict-markers"
